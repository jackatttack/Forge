[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portable-forge"
version = "0.1.0a1"
description = "A portable local execution bridge for human-in-the-loop AI pair programming."
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Forge contributors"}
]
keywords = [
    "ai",
    "pair-programming",
    "local-first",
    "developer-tools",
    "python"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.scripts]
forge = "forge:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
    "forge",
    "forge.*",
    "forge_core",
    "forge_core.*",
    "forge_packages",
    "forge_packages.*"
]

[tool.setuptools.package-data]
"*" = ["*.txt"]