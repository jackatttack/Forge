name: CI and release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.8'
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip

      - name: Install Portable Forge
        run: python -m pip install .

      - name: Verify installed package import
        working-directory: ${{ runner.temp }}
        run: python -c "import forge; print(forge.__file__)"

      - name: Checkout regression tests
        env:
          FORGE_TEST_TARGET: checkout
        run: python -m unittest discover -s tests -t tests -v

      - name: Runtime smoke test
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import os
          import tempfile

          import forge

          root = tempfile.mkdtemp(prefix='portable-forge-ci-')

          forge.run_text(
              '''WRITE smoke.txt
          BEGIN_BODY
          portable-forge-ci
          END_BODY''',
              project_root=root,
          )

          target = os.path.join(root, 'smoke.txt')

          if not os.path.isfile(target):
              raise SystemExit('Forge WRITE smoke did not create its target.')

          with open(target, 'r', encoding='utf-8') as handle:
              text = handle.read().strip()

          if text != 'portable-forge-ci':
              raise SystemExit('Forge WRITE smoke produced unexpected content.')

          audit = forge.run_text(
              'FORGE audit',
              project_root=root,
          )

          rendered = forge.render_standard(audit)

          if 'failed: 0' not in rendered.lower():
              raise SystemExit('FORGE audit did not report a clean runtime.')

          print('Portable Forge runtime smoke passed.')
          PY

  build:
    name: Build distributions
    needs:
      - test

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build tooling
        run: python -m pip install --upgrade build twine

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re

          with open('pyproject.toml', 'r', encoding='utf-8') as handle:
              text = handle.read()

          match = re.search(
              r'^version\s*=\s*"([^"]+)"',
              text,
              re.MULTILINE,
          )

          if not match:
              raise SystemExit('Could not find project version.')

          version = match.group(1)
          expected_tag = 'v' + version
          actual_tag = os.environ['GITHUB_REF_NAME']

          if actual_tag != expected_tag:
              raise SystemExit(
                  'Release tag %s does not match package version %s.'
                  % (
                      actual_tag,
                      version,
                  )
              )

          print('Release tag matches package version:', version)
          PY

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Verify direct wheel import
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import glob
          import os
          import sys
          import tempfile

          wheels = glob.glob(
              os.path.join(
                  os.environ['GITHUB_WORKSPACE'],
                  'dist',
                  '*.whl',
              )
          )

          if len(wheels) != 1:
              raise SystemExit(
                  'Expected exactly one wheel, found %d.'
                  % len(wheels)
              )

          wheel = os.path.realpath(
              wheels[0]
          )

          sys.path.insert(
              0,
              wheel,
          )

          import forge

          origin = os.path.realpath(
              forge.__file__
          )

          print(
              'Direct wheel Forge origin:',
              origin,
          )

          if wheel not in origin:
              raise SystemExit(
                  'Forge was not imported directly from the wheel.'
              )

          root = tempfile.mkdtemp(
              prefix='portable-forge-wheel-ci-'
          )

          forge_home = os.path.join(
              root,
              '.forge',
          )

          ops_run = forge.run_text(
              'FORGE ops',
              project_root=root,
              forge_home=forge_home,
              mode='test',
              store=False,
          )

          if ops_run.get('status') != 'APPLIED':
              raise SystemExit(
                  'FORGE ops failed under direct wheel import: %r'
                  % ops_run.get('status')
              )

          results = (
              ops_run.get('results')
              or []
          )

          if not results:
              raise SystemExit(
                  'FORGE ops returned no result.'
              )

          rows = (
              (
                  results[0].get('data')
                  or {}
              ).get('ops')
              or []
          )

          names = {
              str(
                  row.get('name')
                  or ''
              ).upper()
              for row in rows
          }

          expected = {
              'ALIAS',
              'BRANCH',
              'COPY',
              'DELETE',
              'DIFF',
              'FORGE',
              'INSERT',
              'MAP',
              'READ',
              'REPLACE',
              'REVERT',
              'RUN',
              'SEARCH',
              'URL',
              'WRITE',
          }

          if names != expected:
              raise SystemExit(
                  'Unexpected wheel-mounted op set: %r'
                  % sorted(names)
              )

          audit_run = forge.run_text(
              'FORGE audit',
              project_root=root,
              forge_home=forge_home,
              mode='test',
              store=False,
          )

          if audit_run.get('status') != 'APPLIED':
              raise SystemExit(
                  'FORGE audit failed under direct wheel import.'
              )

          audit_results = (
              audit_run.get('results')
              or []
          )

          audit_data = (
              (
                  audit_results[0].get('data')
                  if audit_results
                  else {}
              )
              or {}
          )

          if audit_data.get('total') != 15:
              raise SystemExit(
                  'Wheel audit did not discover all 15 ops.'
              )

          if audit_data.get('failed') != 0:
              raise SystemExit(
                  'Wheel audit reported failures.'
              )

          help_run = forge.run_text(
              'FORGE help WRITE full',
              project_root=root,
              forge_home=forge_home,
              mode='test',
              store=False,
          )

          if help_run.get('status') != 'APPLIED':
              raise SystemExit(
                  'Full help failed under direct wheel import.'
              )

          print(
              'Direct wheel Forge discovery passed.'
          )
          PY

      - name: Install and verify built wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import os
          import forge

          path = os.path.realpath(
              forge.__file__
          )

          workspace = os.path.realpath(
              os.environ['GITHUB_WORKSPACE']
          )

          try:
              inside_checkout = (
                  os.path.commonpath(
                      [
                          path,
                          workspace,
                      ]
                  )
                  == workspace
              )
          except ValueError:
              inside_checkout = False

          print(
              'Imported Forge from:',
              path,
          )

          if inside_checkout:
              raise SystemExit(
                  'Wheel verification imported Forge from the repository checkout.'
              )

          print(
              'Built wheel import verified outside checkout.'
          )
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build

    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/portable-forge

    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1